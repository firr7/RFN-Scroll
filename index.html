[
{"cat":"ind","key":true,"tag":"1870 ca. · Industria","emoji":"⚙️","title":"Una seconda rivoluzione, cento anni dopo","title_em":"seconda","body":"Dal 1870 circa cambia tutto di nuovo. La Prima Rivoluzione Industriale (fine '700) si basava su <b>carbone, vapore, ferro e tessile</b>, in Inghilterra. La Seconda si basa su <b>elettricità, petrolio, acciaio e chimica</b> — e i protagonisti diventano Germania e Stati Uniti.","fact":"La grande differenza: ora l'innovazione nasce nei laboratori, dalla ricerca scientifica. Prima erano artigiani e inventori pratici a fare le scoperte.","bg":"150deg, #0d0800, #2a1a05, #0d0800"},
{"cat":"ind","key":true,"tag":"1879 · Industria","emoji":"💡","title":"L'elettricità accende il mondo","title_em":"elettricità","body":"Con la <b>dinamo</b> si produce corrente in grandi quantità. Nel 1879 <b>Edison</b> realizza una lampadina a incandescenza duratura. Arrivano il motore elettrico, i tram, l'illuminazione pubblica. L'energia ora si trasporta con i cavi: le fabbriche non devono più stare vicino alle miniere di carbone.","fact":"Un italiano, Galileo Ferraris, nel 1885 scoprì il campo magnetico rotante, base del motore elettrico a corrente alternata. Rifiutò di brevettarlo: voleva che fosse di tutti.","bg":"145deg, #0a0a00, #262005, #0a0800"},
{"cat":"ind","tag":"Motore a scoppio · Industria","emoji":"🚗","title":"Petrolio e motore a scoppio","title_em":"motore a scoppio","body":"Il <b>motore a combustione interna</b> brucia derivati del petrolio: è più piccolo e leggero di quello a vapore. Otto (1876), Daimler e Benz (anni 1880) e poi Diesel (1897) lo perfezionano. Nascono l'<b>automobile</b> e, nel 1903, l'<b>aereo</b> dei fratelli Wright.","fact":"Due italiani, Barsanti e Matteucci, avevano brevettato un motore a scoppio già nel 1854 — vent'anni prima di Otto — ma non riuscirono mai a produrlo in serie.","bg":"155deg, #0a0500, #221005, #0a0500"},
{"cat":"ind","tag":"Acciaio e chimica · Industria","emoji":"🧪","title":"Acciaio e chimica: i nuovi materiali","title_em":"nuovi materiali","body":"Il <b>convertitore Bessemer</b> (1856) rende l'acciaio economico: binari, navi, ponti, grattacieli, armi. La <b>chimica</b> produce fertilizzanti, coloranti sintetici, farmaci (l'aspirina Bayer, 1899) ed esplosivi come la <b>dinamite</b> di Alfred Nobel (1867).","fact":"Nobel, ricchissimo grazie alla dinamite, lasciò il suo patrimonio per creare i Premi Nobel — si dice dopo aver letto un necrologio sbagliato che lo chiamava «mercante di morte».","bg":"140deg, #050a08, #0f2018, #050a08"},
{"cat":"ind","tag":"Comunicazioni · Industria","emoji":"📡","title":"Telefono e radio: il mondo si accorcia","title_em":"accorcia","body":"Il <b>telefono</b> (Bell lo brevetta nel 1876) e il <b>telegrafo senza fili</b> di Guglielmo Marconi (1895; primo segnale oltre l'Atlantico nel 1901) rivoluzionano le comunicazioni. Insieme a ferrovie e navi a vapore, creano un mercato mondiale collegato in tempo reale.","fact":"Il vero inventore del telefono fu probabilmente l'italiano Antonio Meucci, che non poté rinnovare il brevetto per mancanza di soldi. Il Congresso USA lo ha riconosciuto nel 2002.","bg":"150deg, #04080e, #0a1424, #04080e"},
{"cat":"ind","key":true,"tag":"1911-1913 · Industria","emoji":"🏭","title":"Taylor e Ford: la catena di montaggio","title_em":"catena di montaggio","body":"<b>Taylor</b> (1911) teorizza l'organizzazione scientifica del lavoro: ogni operazione viene cronometrata e scomposta in gesti semplici. <b>Henry Ford</b> la applica nel 1913 alla <b>catena di montaggio</b> del Modello T: il pezzo si muove, l'operaio resta fermo e ripete sempre lo stesso gesto.","fact":"Il tempo per montare un'auto scese da oltre 12 ore a circa un'ora e mezza. Nel 1914 Ford raddoppiò il salario a 5 dollari al giorno: i suoi operai dovevano potersi comprare le auto che costruivano.","bg":"145deg, #0a0805, #201a10, #0a0805"},
{"cat":"ind","key":true,"tag":"1873-1896 · Economia","emoji":"📉","title":"La Grande Depressione dell'Ottocento","title_em":"Grande Depressione","body":"Dal 1873 al 1896 l'economia rallenta: si produce troppo e i <b>prezzi crollano</b>. Le risposte: <b>protezionismo</b> (dazi sulle merci straniere), <b>concentrazione</b> delle imprese in trust, cartelli e monopoli, e la corsa alle colonie per trovare nuovi mercati.","fact":"Non fu un crollo improvviso come quello del 1929, ma un lungo periodo di prezzi e profitti bassi. Dalla crisi uscirono poche grandi aziende al posto di tante piccole.","bg":"160deg, #0a0505, #1e0e0a, #0a0505"},
{"cat":"ind","tag":"Capitale finanziario · Economia","emoji":"🏦","title":"Banche e industria si fondono","title_em":"si fondono","body":"Le nuove industrie (acciaio, chimica, elettricità) richiedono capitali enormi. Nascono le <b>banche miste</b>, che raccolgono i risparmi e li investono nelle imprese, spesso controllandole. È il <b>capitalismo finanziario</b>: banche e grandi industrie diventano un unico potere.","fact":"In Italia la Banca Commerciale e il Credito Italiano, fondati negli anni 1890 con capitali tedeschi, finanziarono il decollo industriale dell'età giolittiana.","bg":"140deg, #05080a, #0e1820, #05080a"},
{"cat":"ind","key":true,"tag":"1884-1885 · Imperialismo","emoji":"🌍","title":"L'Africa divisa con il righello","title_em":"righello","body":"Le potenze cercano <b>materie prime, mercati e prestigio</b>: è l'imperialismo. Alla <b>Conferenza di Berlino</b> (1884-85) gli Europei si spartiscono l'Africa senza nessun africano presente, tracciando confini dritti che ignorano popoli e lingue.","fact":"Nel 1914 in tutta l'Africa restavano indipendenti solo due Stati: l'Etiopia (che sconfisse l'Italia ad Adua nel 1896) e la Liberia.","bg":"155deg, #0a0600, #241405, #0a0600"},
{"cat":"ind","tag":"1876-1915 · Società","emoji":"🧳","title":"14 milioni di italiani partono","title_em":"partono","body":"Tra il 1876 e il 1915 circa <b>14 milioni di italiani</b> emigrano: prima verso Europa e Sud America (Argentina, Brasile), poi soprattutto verso gli <b>Stati Uniti</b>. Partono contadini poveri, soprattutto dal Sud e dal Veneto, in cerca di lavoro.","fact":"Il picco fu nel 1913, con quasi 900.000 partenze in un solo anno. I soldi spediti a casa dagli emigrati (le rimesse) aiutarono molto l'economia italiana.","bg":"150deg, #05080d, #0f1626, #05080d"},

{"cat":"mas","tag":"Società di massa","emoji":"👥","title":"Le masse entrano nella storia","title_em":"masse","body":"Tra fine '800 e inizio '900 nasce la <b>società di massa</b>: popolazione in crescita, <b>urbanizzazione</b>, scuola elementare obbligatoria, crescita del <b>ceto medio</b> di impiegati. Milioni di persone, prima escluse, iniziano a leggere giornali, votare, consumare e partecipare alla politica.","fact":"Il «secolo delle masse» cambia anche la politica: per governare non basta più l'accordo tra pochi notabili, serve il consenso di milioni di persone.","bg":"145deg, #0d0508, #241016, #0d0508"},
{"cat":"mas","key":true,"tag":"1889-1892 · Società di massa","emoji":"🚩","title":"Partiti e sindacati di massa","title_em":"di massa","body":"Nascono i <b>partiti di massa</b>: organizzati, con iscritti, sedi, giornali e un programma. Il modello è la SPD tedesca. Nel 1889 nasce la <b>Seconda Internazionale</b> socialista; nel 1892 a Genova il <b>Partito Socialista Italiano</b>. Crescono i sindacati e le Camere del Lavoro.","fact":"Prima i partiti erano gruppi di notabili che si riunivano solo per le elezioni. Il partito di massa invece vive tutto l'anno e organizza anche il tempo libero dei suoi iscritti.","bg":"160deg, #0d0000, #220808, #0d0000"},
{"cat":"mas","key":true,"tag":"1891 · Chiesa","emoji":"⛪","title":"La Rerum Novarum: la Chiesa e gli operai","title_em":"Rerum Novarum","body":"Nel 1891 papa <b>Leone XIII</b> pubblica l'enciclica Rerum Novarum. Rifiuta sia il socialismo (difende la proprietà privata) sia lo sfruttamento capitalista: chiede <b>salari giusti</b>, tutela dei lavoratori e riconosce le associazioni operaie cattoliche.","fact":"È l'atto di nascita della dottrina sociale della Chiesa. Da qui nascono le leghe bianche e le cooperative cattoliche, rivali di quelle rosse socialiste.","bg":"145deg, #0a0a08, #1e1c14, #0a0a08"},
{"cat":"mas","tag":"1903 · Donne","emoji":"♀️","title":"Le suffragette: «Fatti, non parole»","title_em":"suffragette","body":"In Gran Bretagna <b>Emmeline Pankhurst</b> fonda nel 1903 un movimento che lotta per il <b>voto alle donne</b> con azioni clamorose: manifestazioni, vetrine rotte, scioperi della fame in carcere. Intanto le donne entrano in massa nel lavoro di fabbrica e d'ufficio.","fact":"Il primo Paese a dare il voto alle donne fu la Nuova Zelanda nel 1893. In Gran Bretagna arrivò nel 1918 (solo sopra i 30 anni), in Italia solo nel 1946.","bg":"155deg, #0a0510, #1c0c24, #0a0510"},
{"cat":"mas","key":true,"tag":"1894 · Nazionalismo","emoji":"⚖️","title":"L'affare Dreyfus divide la Francia","title_em":"Dreyfus","body":"Nel 1894 il capitano ebreo <b>Alfred Dreyfus</b> viene condannato per spionaggio con prove false. La Francia si spacca. Lo scrittore <b>Émile Zola</b> lo difende con l'articolo «J'accuse» (1898). Il caso mostra la forza del nuovo <b>nazionalismo aggressivo e dell'antisemitismo</b>.","fact":"Il giornalista Theodor Herzl, che seguì il processo, ne fu così colpito da fondare il sionismo: il movimento per uno Stato ebraico. Dreyfus fu riabilitato solo nel 1906.","bg":"150deg, #08080d, #14142a, #08080d"},
{"cat":"mas","key":true,"tag":"1895-1900 · Belle Époque","emoji":"🥂","title":"Belle Époque: l'età dell'ottimismo","title_em":"Belle Époque","body":"Tra fine '800 e il 1914 l'Europa vive in pace, si arricchisce e crede nel <b>progresso infinito</b> (positivismo). Simboli: l'<b>Esposizione Universale di Parigi del 1900</b>, i caffè, i cabaret, l'Art Nouveau (in Italia «Liberty») e il <b>cinema</b> dei fratelli Lumière (1895).","fact":"Il nome «Belle Époque» fu dato dopo, negli anni '20: chi aveva vissuto la Prima Guerra Mondiale guardava a quel periodo come a un paradiso perduto.","bg":"140deg, #0d0a05, #2a200a, #0d0a05"},
{"cat":"mas","key":true,"tag":"1896 · Tempo libero","emoji":"🚴","title":"Sport, giornali e pubblicità","title_em":"Sport","body":"Nasce il <b>tempo libero di massa</b>. Nel 1896 ad Atene le prime <b>Olimpiadi moderne</b> volute da de Coubertin. Arrivano Tour de France (1903) e Giro d'Italia (1909). Esplodono i giornali popolari, i grandi magazzini e la <b>pubblicità</b>.","fact":"Il Giro d'Italia fu inventato dalla Gazzetta dello Sport per vendere più copie: per questo la maglia del leader è rosa, come le pagine del giornale (ma la maglia rosa arrivò solo nel 1931).","bg":"155deg, #0d0508, #2a0f1a, #0d0508"},
{"cat":"mas","tag":"1899-1905 · Cultura","emoji":"🌀","title":"Le certezze iniziano a crollare","title_em":"crollare","body":"Sotto l'ottimismo qualcosa si incrina. <b>Freud</b> scopre l'inconscio (L'interpretazione dei sogni, 1899): l'uomo non è del tutto razionale. <b>Einstein</b> con la relatività (1905) mette in crisi la fisica classica. Nietzsche attacca i valori tradizionali.","fact":"È la «crisi del positivismo»: proprio mentre la tecnica trionfa, filosofi e scienziati scoprono che il mondo è molto meno ordinato e prevedibile di quanto si credeva.","bg":"160deg, #05050d, #100c22, #05050d"},

{"cat":"gio","key":true,"tag":"1898-1900 · Crisi di fine secolo","emoji":"💥","title":"Cannoni sulla folla a Milano","title_em":"Cannoni","body":"Nel maggio 1898 a Milano la folla protesta per l'aumento del prezzo del pane. Il generale <b>Bava Beccaris</b> fa sparare con i cannoni: oltre 80 morti. Il re Umberto I lo premia. Il 29 luglio 1900 l'anarchico <b>Gaetano Bresci</b> uccide il re a Monza per vendetta.","fact":"Il nuovo re Vittorio Emanuele III capì che la repressione non funzionava: affidò il governo ai liberali progressisti. Si apre l'età giolittiana.","bg":"160deg, #0d0000, #200505, #0d0000"},
{"cat":"gio","key":true,"tag":"1901-1914 · Età giolittiana","emoji":"🎩","title":"Giolitti: lo Stato non spara più","title_em":"non spara più","body":"<b>Giovanni Giolitti</b>, prima ministro dell'Interno (1901) e poi più volte capo del governo fino al 1914, cambia strategia: nei conflitti tra operai e padroni lo Stato resta <b>neutrale</b>. Gli scioperi sono legittimi; la polizia interviene solo se c'è violenza.","fact":"L'idea di Giolitti: se i salari crescono, gli operai consumano di più, l'economia cresce e i lavoratori si integrano nello Stato invece di volerlo rovesciare.","bg":"145deg, #030a05, #0a1e10, #030a05"},
{"cat":"gio","key":true,"tag":"1902-1912 · Riforme","emoji":"📋","title":"Le riforme sociali di Giolitti","title_em":"riforme","body":"Leggi sul <b>lavoro di donne e bambini</b> (1902, età minima 12 anni), <b>riposo settimanale</b> (1907), assicurazione contro gli infortuni, <b>nazionalizzazione delle ferrovie</b> (1905), monopolio statale delle assicurazioni sulla vita con l'INA (1912), scuola elementare a carico dello Stato (1911).","fact":"Giolitti cercò anche di portare i socialisti al governo: offrì un ministero a Filippo Turati nel 1903, ma lui rifiutò per non rompere il partito.","bg":"150deg, #040a06, #0c2014, #040a06"},
{"cat":"gio","tag":"Decollo industriale · Età giolittiana","emoji":"🏗️","title":"Il triangolo industriale","title_em":"triangolo","body":"L'Italia vive il suo primo vero <b>decollo industriale</b>, concentrato nel triangolo <b>Milano-Torino-Genova</b>. Nascono o crescono FIAT (1899), Pirelli, Olivetti (1908), Ansaldo. Senza carbone, l'Italia punta sull'<b>energia idroelettrica</b>: il «carbone bianco» delle Alpi.","fact":"Il protezionismo favorì le industrie del Nord, ma i dazi sul grano danneggiarono i consumatori e il Sud agricolo. Lo sviluppo fu reale, ma molto squilibrato.","bg":"140deg, #050805, #10180c, #050805"},
{"cat":"gio","tag":"Questione meridionale · Età giolittiana","emoji":"🌾","title":"Il «ministro della malavita»","title_em":"malavita","body":"Il Sud resta povero e agricolo: il divario con il Nord cresce. Al Sud Giolitti governa con i notabili locali e tollera <b>brogli, clientelismo e intimidazioni</b> alle elezioni. Lo storico <b>Gaetano Salvemini</b> lo chiama nel 1910 «ministro della malavita».","fact":"È il «doppio volto» di Giolitti: progressista e riformatore al Nord, conservatore e clientelare al Sud. Una contraddizione che va sempre citata all'interrogazione.","bg":"155deg, #0a0805, #201a0c, #0a0805"},
{"cat":"gio","key":true,"tag":"1911-1912 · Politica estera","emoji":"🏜️","title":"La guerra di Libia","title_em":"Libia","body":"Spinto da nazionalisti, Chiesa, banche e industriali, nel 1911 Giolitti attacca l'<b>Impero ottomano</b> e conquista la Libia. Con la pace di Losanna (1912) l'Italia ottiene <b>Libia e Dodecaneso</b>. Ma la guerra costa molto e la Libia è soprattutto deserto: lo «scatolone di sabbia».","fact":"Il 1° novembre 1911 il tenente Giulio Gavotti lanciò delle bombe a mano da un aereo su un accampamento turco: il primo bombardamento aereo della storia.","bg":"150deg, #0d0800, #2a1805, #0d0800"},
{"cat":"gio","key":true,"tag":"1912 · Riforma elettorale","emoji":"🗳️","title":"Suffragio universale maschile","title_em":"universale maschile","body":"Nel 1912 votano <b>tutti i maschi dai 30 anni</b>, anche analfabeti, e quelli dai 21 anni che sanno leggere o hanno fatto il servizio militare. Gli elettori passano da circa <b>3 a oltre 8 milioni</b>. Le donne restano escluse.","fact":"Giolitti allargò il voto per integrare le masse nello Stato liberale. Ma fu un boomerang: i nuovi elettori premiarono i partiti di massa (socialisti e cattolici), non i liberali.","bg":"140deg, #050a0d, #0c1a22, #050a0d"},
{"cat":"gio","key":true,"tag":"1913 · Patto Gentiloni","emoji":"🤝","title":"Il Patto Gentiloni: voti cattolici","title_em":"Gentiloni","body":"Alle elezioni del 1913 i cattolici (fino ad allora tenuti lontani dal voto dal <b>non expedit</b> del papa) votano i candidati liberali che si impegnano a <b>difendere la scuola cattolica e opporsi al divorzio</b>. L'accordo prende il nome di Vincenzo Gentiloni, presidente dell'Unione elettorale cattolica.","fact":"Oltre 200 deputati liberali furono eletti con i voti cattolici. Giolitti vinse, ma ormai dipendeva da altri: la sua maggioranza era fragile.","bg":"155deg, #0a0a08, #1e1e14, #0a0a08"},
{"cat":"gio","key":true,"tag":"1914 · Fine dell'età giolittiana","emoji":"🔚","title":"Giolitti stretto tra due estremi","title_em":"due estremi","body":"Dopo il 1912 crescono le ali estreme: i <b>socialisti massimalisti</b> (rivoluzionari, con Mussolini direttore dell'Avanti!) e i <b>nazionalisti</b> di Corradini. Nel marzo 1914 Giolitti si dimette; gli succede <b>Antonio Salandra</b>, più conservatore. A giugno scoppia la Settimana rossa.","fact":"Mussolini a quel tempo era socialista e contrario alla guerra. Pochi mesi dopo cambierà idea, sarà espulso dal partito e diventerà interventista.","bg":"160deg, #0a0505, #1e0c0a, #0a0505"},

{"cat":"igm","key":true,"tag":"1882-1907 · Cause IGM","emoji":"🔗","title":"Due blocchi di alleanze","title_em":"blocchi","body":"<b>Triplice Alleanza</b> (1882): Germania, Austria-Ungheria, Italia. <b>Triplice Intesa</b> (1907): Francia, Russia, Gran Bretagna, nata da accordi successivi (franco-russo 1894, Entente cordiale 1904, anglo-russo 1907). Un conflitto locale poteva trascinare tutti.","fact":"La Triplice Alleanza era difensiva: per questo nel 1914 l'Italia si dichiarò neutrale, perché era l'Austria ad aver attaccato. Nel 1915 entrò in guerra contro i suoi ex alleati.","bg":"145deg, #0d0000, #240505, #0d0000"},
{"cat":"igm","key":true,"tag":"1898-1906 · Cause IGM","emoji":"⚓","title":"La sfida navale anglo-tedesca","title_em":"navale","body":"Il kaiser <b>Guglielmo II</b> lancia la <b>Weltpolitik</b>: la Germania vuole colonie e una flotta da grande potenza. La Gran Bretagna, che domina i mari, si sente minacciata. Nel 1906 vara la <b>Dreadnought</b>, una corazzata così potente da rendere vecchie tutte le altre: inizia la corsa agli armamenti.","fact":"Guglielmo II era nipote della regina Vittoria e cugino di re Giorgio V e dello zar Nicola II: i tre sovrani che si fecero la guerra erano tutti parenti.","bg":"160deg, #020810, #06101e, #020810"},
{"cat":"igm","key":true,"tag":"1871 · Cause IGM","emoji":"🇫🇷","title":"Alsazia-Lorena: la ferita francese","title_em":"Alsazia-Lorena","body":"Nel 1871, dopo la sconfitta contro la Prussia, la Francia perde l'<b>Alsazia e la Lorena</b>, regioni ricche di carbone e ferro. Nasce il <b>revanscismo</b>: il desiderio di rivincita contro la Germania, che attraversa tutta la politica francese fino al 1914.","fact":"Nel 1871 l'Impero tedesco fu proclamato nella Sala degli Specchi di Versailles: un'umiliazione che la Francia non dimenticò. Nel 1919 fece firmare la pace alla Germania nella stessa sala.","bg":"150deg, #05050d, #0e0e22, #05050d"},
{"cat":"igm","key":true,"tag":"1905-1911 · Cause IGM","emoji":"🐪","title":"Le crisi marocchine","title_em":"marocchine","body":"Due volte (<b>Tangeri 1905, Agadir 1911</b>) la Germania contesta l'influenza francese sul Marocco, sperando di dividere Francia e Gran Bretagna. Ottiene l'effetto opposto: l'<b>Intesa si rafforza</b> e la Germania si sente sempre più accerchiata.","fact":"Ad Agadir la Germania mandò una cannoniera, la Panther. Si arrivò vicinissimi alla guerra già tre anni prima del 1914.","bg":"155deg, #0d0800, #261605, #0d0800"},
{"cat":"igm","key":true,"tag":"1908-1913 · Cause IGM","emoji":"🧨","title":"I Balcani, polveriera d'Europa","title_em":"polveriera","body":"L'Impero ottomano si sgretola. Nel 1908 l'Austria annette la <b>Bosnia-Erzegovina</b>, abitata da molti serbi: la Serbia, appoggiata dalla Russia (<b>panslavismo</b>), è furiosa. Le <b>guerre balcaniche</b> (1912-13) ingrandiscono la Serbia e rendono la tensione con l'Austria esplosiva.","fact":"L'Austria-Ungheria era un impero di tanti popoli: temeva che il nazionalismo serbo contagiasse gli slavi al suo interno e la facesse crollare. Per questo voleva schiacciare la Serbia.","bg":"160deg, #0d0500, #2a0e05, #0d0500"},
{"cat":"igm","tag":"Clima culturale · Cause IGM","emoji":"🪖","title":"Nazionalismo e culto della guerra","title_em":"culto della guerra","body":"Le cause profonde: <b>nazionalismo aggressivo</b>, <b>militarismo</b>, rivalità economiche e imperialiste, <b>corsa agli armamenti</b>. Gli stati maggiori hanno piani di guerra rigidi e veloci, come il <b>Piano Schlieffen</b> tedesco: battere la Francia passando dal Belgio, poi voltarsi contro la Russia.","fact":"Quasi tutti pensavano a una guerra breve: «a casa per Natale». I futuristi italiani la chiamavano addirittura «sola igiene del mondo».","bg":"145deg, #080805, #18180c, #080805"},
{"cat":"igm","key":true,"tag":"28 Giugno 1914 · Causa occasionale","emoji":"🔫","title":"Sarajevo: due colpi di pistola","title_em":"Sarajevo","body":"Il 28 giugno 1914 lo studente bosniaco-serbo <b>Gavrilo Princip</b>, legato all'organizzazione nazionalista Mano Nera, uccide a Sarajevo l'erede al trono austriaco <b>Francesco Ferdinando</b> e la moglie Sofia. È la <b>causa occasionale</b> della guerra.","fact":"Quella mattina un primo attentato con una bomba era fallito. Poche ore dopo l'autista sbagliò strada, si fermò per fare retromarcia… proprio davanti a Princip.","bg":"160deg, #0d0000, #1f0505, #0a0808"},
{"cat":"igm","key":true,"tag":"Luglio-Agosto 1914 · Cause IGM","emoji":"🔥","title":"Una settimana per incendiare l'Europa","title_em":"incendiare","body":"<b>23 luglio</b>: ultimatum austriaco alla Serbia. <b>28 luglio</b>: l'Austria dichiara guerra. <b>30 luglio</b>: la Russia mobilita. <b>1° agosto</b>: la Germania dichiara guerra alla Russia, il 3 alla Francia, e invade il Belgio neutrale. <b>4 agosto</b>: la Gran Bretagna entra in guerra.","fact":"Il cancelliere tedesco definì il trattato che garantiva la neutralità del Belgio «un pezzo di carta». Fu proprio la violazione del Belgio a convincere gli inglesi a combattere.","bg":"155deg, #0d0300, #2a0a00, #0d0300"}

<script type="application/json" id="interr-data">
[
{"cat":"int","tag":"Domanda 1 · Interrogazione","emoji":"🎯","title":"Seconda Rivoluzione Industriale: caratteristiche","title_em":"caratteristiche","body":"<b>Quando/dove:</b> dal 1870 circa, protagonisti Germania e USA. <b>Energie:</b> elettricità e petrolio. <b>Settori:</b> acciaio, chimica, elettrico, automobile. <b>Novità:</b> legame scienza-industria, grandi imprese concentrate (trust, cartelli), capitalismo finanziario, nuova organizzazione del lavoro.","fact":"Confronto da fare sempre: Prima Rivoluzione = carbone, vapore, tessile, Inghilterra. Seconda = elettricità, petrolio, acciaio/chimica, Germania e USA.","bg":"150deg, #0d0800, #2a1a05, #0d0800"},
{"cat":"int","tag":"Domanda 2 · Interrogazione","emoji":"🎯","title":"Taylorismo e fordismo","title_em":"fordismo","body":"<b>Taylorismo:</b> organizzazione scientifica del lavoro (1911), ogni mansione cronometrata e scomposta in gesti semplici, separazione tra chi progetta e chi esegue. <b>Fordismo:</b> catena di montaggio (1913), produzione in serie, prezzi bassi, salari alti per creare consumatori. <b>Conseguenze:</b> lavoro ripetitivo e alienante, operaio non specializzato.","fact":"Il Modello T costava sempre meno grazie alla catena: produzione di massa e consumo di massa nascono insieme.","bg":"145deg, #0a0805, #201a10, #0a0805"},
{"cat":"int","tag":"Domanda 3 · Interrogazione","emoji":"🎯","title":"La società di massa","title_em":"di massa","body":"<b>Cause:</b> crescita demografica, urbanizzazione, industrializzazione, istruzione obbligatoria. <b>Caratteristiche:</b> ceto medio, consumi di massa, stampa e pubblicità, tempo libero e sport. <b>Politica:</b> partiti e sindacati di massa, allargamento del voto, suffragette, nazionalismo, Chiesa con la Rerum Novarum (1891).","fact":"Parola chiave: partecipazione. Le masse, prima escluse, diventano protagoniste della vita politica, economica e culturale.","bg":"145deg, #0d0508, #241016, #0d0508"},
{"cat":"int","tag":"Domanda 4 · Interrogazione","emoji":"🎯","title":"Belle Époque: luci e ombre","title_em":"luci e ombre","body":"<b>Luci:</b> pace, benessere, fiducia nel progresso (positivismo), Esposizioni universali, cinema, Liberty, vita mondana. <b>Ombre:</b> povertà e emigrazione, nazionalismo e antisemitismo (affare Dreyfus), imperialismo, corsa agli armamenti, crisi delle certezze (Freud, Einstein, Nietzsche).","fact":"Il benessere era soprattutto della borghesia urbana. Sotto la superficie crescevano le tensioni che esplosero nel 1914.","bg":"140deg, #0d0a05, #2a200a, #0d0a05"},
{"cat":"int","tag":"Domanda 5 · Interrogazione","emoji":"🎯","title":"La politica di Giolitti","title_em":"Giolitti","body":"<b>Contesto:</b> crisi di fine secolo, Bava Beccaris 1898, regicidio 1900. <b>Strategia:</b> neutralità dello Stato negli scioperi, integrare socialisti e cattolici. <b>Riforme:</b> lavoro minorile e femminile, riposo settimanale, ferrovie statali, INA, scuola. <b>Economia:</b> decollo industriale del triangolo. <b>Limiti:</b> questione meridionale, clientelismo («ministro della malavita»).","fact":"Il concetto chiave è il «doppio volto»: riformista al Nord, trasformista e clientelare al Sud.","bg":"145deg, #030a05, #0a1e10, #030a05"},
{"cat":"int","tag":"Domanda 6 · Interrogazione","emoji":"🎯","title":"Il 1912-13: voto e Patto Gentiloni","title_em":"Gentiloni","body":"<b>Riforma 1912:</b> suffragio universale maschile (30 anni, o 21 con istruzione/servizio militare), da circa 3 a oltre 8 milioni di elettori. <b>Patto Gentiloni 1913:</b> voti cattolici ai liberali in cambio di difesa della scuola cattolica e no al divorzio. <b>Risultato:</b> Giolitti vince ma è indebolito; crescono socialisti e nazionalisti.","fact":"Allargando il voto Giolitti voleva rafforzare lo Stato liberale. In realtà favorì i partiti di massa che lo avrebbero superato.","bg":"140deg, #050a0d, #0c1a22, #050a0d"},
{"cat":"int","tag":"Domanda 7 · Interrogazione","emoji":"🎯","title":"La guerra di Libia (1911-12)","title_em":"Libia","body":"<b>Perché:</b> pressioni di nazionalisti, Banco di Roma, industria pesante, ambienti cattolici; prestigio internazionale; sbocco per l'emigrazione. <b>Come:</b> guerra contro l'Impero ottomano. <b>Risultato:</b> pace di Losanna 1912, Libia e Dodecaneso. <b>Conseguenze:</b> spese enormi, socialisti radicalizzati, nazionalisti rafforzati.","fact":"Giolitti, prudente per natura, fece la guerra anche per togliere argomenti ai nazionalisti. Ottenne l'effetto opposto: li rafforzò.","bg":"150deg, #0d0800, #2a1805, #0d0800"},
{"cat":"int","tag":"Domanda 8 · Interrogazione","emoji":"🎯","title":"Cause della Prima Guerra Mondiale","title_em":"Cause","body":"<b>Profonde:</b> nazionalismi, imperialismo e rivalità economiche, sfida navale anglo-tedesca, revanscismo francese (Alsazia-Lorena), questione balcanica (Austria contro Serbia/Russia), corsa agli armamenti, sistema di alleanze rigido. <b>Occasionale:</b> attentato di Sarajevo, 28 giugno 1914.","fact":"Distinzione da fare sempre: Sarajevo non è la causa della guerra, è la scintilla. La polvere da sparo era già accumulata da decenni.","bg":"160deg, #0d0000, #1f0505, #0a0808"},
{"cat":"int","tag":"Domanda 9 · Interrogazione","emoji":"🎯","title":"Le alleanze e la crisi di luglio","title_em":"crisi di luglio","body":"<b>Triplice Alleanza</b> (1882): Germania, Austria-Ungheria, Italia. <b>Triplice Intesa</b> (1907): Francia, Russia, Gran Bretagna. <b>Effetto domino 1914:</b> ultimatum alla Serbia → Austria dichiara guerra → mobilitazione russa → Germania contro Russia e Francia → invasione del Belgio → entra la Gran Bretagna. <b>Italia:</b> neutrale.","fact":"L'Italia restò neutrale perché la Triplice era difensiva e l'Austria non l'aveva consultata. Entrò in guerra nel 1915, con l'Intesa.","bg":"145deg, #0d0000, #240505, #0d0000"}
]

.slide { width:100%; height:100%; height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; overflow:hidden; }

.slide-overlay { position:absolute; inset:0; z-index:1; background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.45) 40%, rgba(0,0,0,.15) 75%, rgba(0,0,0,.05) 100%); }

.slide-tag { display:inline-block; font-size:.62rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:.28rem .7rem; border-radius:2px; margin-bottom:.75rem; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); color:rgba(255,255,255,.7); }

#bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:50; padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:space-around; background:linear-gradient(to top, rgba(0,0,0,.92), transparent); }

/* SAVED SCREEN */
#saved-screen { position:fixed; inset:0; z-index:200; background:#0a0a10; display:none; flex-direction:column; }

.saved-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:1rem 1.1rem 1rem 1rem; cursor:pointer; position:relative; transition:opacity .2s, transform .2s; }

#saved-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; color:rgba(255,255,255,.25); font-size:.85rem; text-align:center; padding:4rem 2rem; }
#saved-empty .ei { font-size:2.5rem; }

<script>
var CARDS = JSON.parse(document.getElementById('cards-data').textContent);
var INTERR = JSON.parse(document.getElementById('interr-data').textContent);
var STORE_KEY = 'knowscroll-v2-liked';

var currentIdx = 0;
var filtered = CARDS.slice();
var liked = {};
try { liked = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { liked = {}; }
function saveLiked() { try { localStorage.setItem(STORE_KEY, JSON.stringify(liked)); } catch (e) {} }

// ── BUILD ──
function buildSlides(cards) {
  var c = document.getElementById('reel-container');
  c.innerHTML = '';
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var num = (i+1 < 10 ? '0' : '') + (i+1);
    var tot = (cards.length < 10 ? '0' : '') + cards.length;

    var slide = document.createElement('div');
    slide.className = 'slide cat-' + card.cat + (i === 0 ? ' active' : '');

    var bg = document.createElement('div');
    bg.className = 'slide-bg';
    bg.style.background = 'linear-gradient(' + card.bg + ')';

    var ov = document.createElement('div');
    ov.className = 'slide-overlay';

    var sc = document.createElement('div');
    sc.className = 'slide-content';

    var tagEl = document.createElement('div');
    tagEl.className = 'slide-tag';
    tagEl.textContent = card.emoji + ' ' + card.tag;

    var numEl = document.createElement('div');
    numEl.className = 'slide-num';
    numEl.textContent = num + ' / ' + tot;

    var titleEl = document.createElement('h2');
    titleEl.className = 'slide-title';
    var t = card.title, em = card.title_em;
    if (em && t.indexOf(em) !== -1) {
      var before = t.substring(0, t.indexOf(em));
      var after = t.substring(t.indexOf(em) + em.length);
      var emEl = document.createElement('em');
      emEl.textContent = em;
      if (before) titleEl.appendChild(document.createTextNode(before));
      titleEl.appendChild(emEl);
      if (after) titleEl.appendChild(document.createTextNode(after));
    } else {
      titleEl.textContent = t;
    }

    var bodyEl = document.createElement('p');
    bodyEl.className = 'slide-body';
    bodyEl.innerHTML = card.body;

    var factEl = document.createElement('div');
    factEl.className = 'slide-fact';
    factEl.innerHTML = '&#128161; ' + card.fact;

    sc.appendChild(tagEl);
    sc.appendChild(numEl);
    sc.appendChild(titleEl);
    sc.appendChild(bodyEl);
    sc.appendChild(factEl);
    slide.appendChild(bg);
    slide.appendChild(ov);
    slide.appendChild(sc);
    c.appendChild(slide);
  }
  updateCounter();
  updateProgress();
  updateLikeBtn();
}

// ── SCROLL ──
function updateActive() {
  var c = document.getElementById('reel-container');
  var idx = Math.round(c.scrollTop / c.clientHeight);
  if (idx === currentIdx) return;
  currentIdx = idx;
  var slides = c.querySelectorAll('.slide');
  for (var i = 0; i < slides.length; i++) slides[i].classList.toggle('active', i === idx);
  updateCounter();
  updateProgress();
  updateLikeBtn();
  if (idx > 0) document.getElementById('scroll-hint').classList.add('hidden');
}

function updateCounter() {
  document.getElementById('slideCounter').textContent = (currentIdx+1) + ' / ' + filtered.length;
}

function updateProgress() {
  var pct = filtered.length > 1 ? (currentIdx / (filtered.length - 1)) * 100 : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateLikeBtn() {
  var card = filtered[currentIdx];
  if (!card) return;
  var key = card.cat + '|' + card.title;
  document.getElementById('likeIcon').textContent = liked[key] ? '\u2665' : '\u2661';
  document.getElementById('btnLike').classList.toggle('liked', !!liked[key]);
}

// ── ACTIONS ──
function toggleLike() {
  var card = filtered[currentIdx];
  if (!card) return;
  var key = card.cat + '|' + card.title;
  if (liked[key]) delete liked[key]; else liked[key] = true;
  saveLiked();
  updateLikeBtn();
  var icon = document.getElementById('likeIcon');
  icon.style.transform = 'scale(1.4)';
  setTimeout(function() { icon.style.transform = ''; }, 200);
}

function shuffleRandom() {
  var c = document.getElementById('reel-container');
  if (filtered.length < 2) return;
  var r;
  do { r = Math.floor(Math.random() * filtered.length); } while (r === currentIdx);
  c.scrollTo({ top: r * c.clientHeight, behavior: 'smooth' });
}

// ── FILTER ──
function setActiveNav(el) {
  var navItems = document.querySelectorAll('.nav-item');
  for (var i = 0; i < navItems.length; i++) navItems[i].classList.remove('active');
  if (el) el.classList.add('active');
}

function filterCat(cat, el) {
  closeSaved();
  setActiveNav(el);
  if (cat === 'all') filtered = CARDS.slice();
  else if (cat === 'key') filtered = CARDS.filter(function(c) { return c.key; });
  else if (cat === 'int') filtered = INTERR.slice();
  else filtered = CARDS.filter(function(c) { return c.cat === cat; });
  currentIdx = 0;
  buildSlides(filtered);
  document.getElementById('reel-container').scrollTo({ top: 0 });
}

// ── SAVED ──
function openSaved(el) {
  setActiveNav(el);
  renderSaved();
  document.getElementById('saved-screen').classList.add('open');
}

function closeSaved() {
  document.getElementById('saved-screen').classList.remove('open');
}

function renderSaved() {
  var all = CARDS.concat(INTERR);
  var saved = all.filter(function(c) { return liked[c.cat + '|' + c.title]; });
  var list = document.getElementById('saved-list');
  document.getElementById('saved-count').textContent = saved.length + (saved.length === 1 ? ' card salvata' : ' card salvate');
  list.innerHTML = '';

  if (saved.length === 0) {
    var empty = document.createElement('div');
    empty.id = 'saved-empty';
    var ei = document.createElement('div');
    ei.className = 'ei';
    ei.textContent = '\u2661';
    var et = document.createElement('div');
    et.textContent = 'Nessuna card salvata. Premi \u2661 su una card per salvarla qui.';
    empty.appendChild(ei);
    empty.appendChild(et);
    list.appendChild(empty);
    return;
  }

  saved.forEach(function(card) {
    var key = card.cat + '|' + card.title;
    var div = document.createElement('div');
    div.className = 'saved-card';

    var tagEl = document.createElement('div');
    tagEl.className = 'saved-card-tag';
    tagEl.textContent = card.emoji + ' ' + card.tag;

    var titleEl = document.createElement('div');
    titleEl.className = 'saved-card-title';
    titleEl.textContent = card.title;

    var removeEl = document.createElement('div');
    removeEl.className = 'saved-remove';
    removeEl.textContent = '\u00d7';
    removeEl.onclick = function(e) {
      e.stopPropagation();
      delete liked[key];
      saveLiked();
      div.style.opacity = '0';
      div.style.transform = 'translateX(20px)';
      setTimeout(renderSaved, 200);
    };

    div.appendChild(tagEl);
    div.appendChild(titleEl);
    div.appendChild(removeEl);

    div.onclick = function() {
      closeSaved();
      filtered = [card];
      currentIdx = 0;
      buildSlides(filtered);
      document.getElementById('reel-container').scrollTo({ top: 0 });
      setActiveNav(null);
    };

    list.appendChild(div);
  });
}

// ── KEYBOARD ──
document.addEventListener('keydown', function(e) {
  var c = document.getElementById('reel-container');
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); c.scrollBy({ top: c.clientHeight, behavior: 'smooth' }); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); c.scrollBy({ top: -c.clientHeight, behavior: 'smooth' }); }
  else if (e.key === 'Escape') closeSaved();
});

// ── INIT ──
buildSlides(filtered);
document.getElementById('reel-container').addEventListener('scroll', updateActive, { passive: true });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
